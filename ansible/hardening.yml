- hosts: all
  become: true
  tasks:
    - name: Ensure UFW present
      apt:
        name: ufw
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure fail2ban present
      apt:
        name: fail2ban
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Disable root SSH login (backup file)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PermitRootLogin'
        line: 'PermitRootLogin no'
        backup: yes

    - name: Ensure unattended upgrades present
      apt:
        name: unattended-upgrades
        state: present
      when: ansible_facts['os_family'] == 'Debian'
